name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check web UI script parses
        run: |
          sed -n '/<script>/,/<\/script>/p' static/index.html | sed '1d;$d' > /tmp/ui.js
          node --check /tmp/ui.js
      - name: Smoke test (regex mode, no model needed)
        run: python receiptsorter.py samples --no-llm --out out --move-files && cat out/receipts.csv
